{% assign limit = include.limit | default: site.data.writing.essays.size %}
<ul class="writing-list">
  {% for essay in site.data.writing.essays limit: limit %}
  <li>
    <a class="writing-title" href="{{ essay.url }}">{{ essay.title }}</a>
    <span class="writing-meta">{{ site.data.writing.publication.name }} · {{ essay.date | date: "%b %-d, %Y" }}</span>
    <p class="writing-desc">{{ essay.description }}</p>
  </li>
  {% endfor %}
</ul>
